<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cumpleaños</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }
    img {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

  <img id="visor" src="" alt="Foto de cumpleaños">

  <script>
    const totalImagenes = 6;
    let indiceActual = 1;
    const extensiones = ['.jpg', '.png', '.jpeg', '.webp'];
    const imgElement = document.getElementById('visor');

    function cargarImagen(indice) {
      let extIndex = 0;

      function intentarSiguienteExtension() {
        if (extIndex >= extensiones.length) {
          console.error(`No se encontró la imagen: cumple ${indice}`);
          return;
        }
        const ruta = `imagenes/cumple ${indice}${extensiones[extIndex]}`;
        const tempImg = new Image();
        
        tempImg.onload = () => {
          imgElement.src = ruta;
        };
        
        tempImg.onerror = () => {
          extIndex++;
          intentarSiguienteExtension();
        };

        tempImg.src = ruta;
      }

      intentarSiguienteExtension();
    }

    function siguienteImagen() {
      indiceActual = (indiceActual % totalImagenes) + 1;
      cargarImagen(indiceActual);
    }

    function anteriorImagen() {
      indiceActual = (indiceActual - 2 + totalImagenes) % totalImagenes + 1;
      cargarImagen(indiceActual);
    }

    // Cambiar imagen al hacer clic
    document.addEventListener('click', siguienteImagen);

    // Cambiar imagen con flechas del teclado
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        siguienteImagen();
      } else if (e.key === 'ArrowLeft') {
        anteriorImagen();
      }
    });

    // Cargar la primera imagen al iniciar
    cargarImagen(indiceActual);
  </script>

</body>
</html>
